spring:
  application:
    name: mcp-server-test

  autoconfigure:
    exclude:
      # Spring AI 2.0.0-M7: spring-ai-autoconfigure-mcp-server-webmvc has stale
      # spring-autoconfigure-metadata.properties referencing
      # org.springframework.ai.mcp.server.common.autoconfigure.McpServerStdioDisabledCondition
      # which was removed after M1 when the mcp-server-common artifact was dissolved.
      # Excluding these autoconfiguration classes prevents the ClassNotFoundException
      # in test context loading.
      - org.springframework.ai.mcp.server.webmvc.autoconfigure.McpServerSseWebMvcAutoConfiguration
      - org.springframework.ai.mcp.server.webmvc.autoconfigure.McpServerStreamableHttpWebMvcAutoConfiguration
      - org.springframework.ai.mcp.server.webmvc.autoconfigure.McpServerStatelessWebMvcAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Mock JwkSetUri for tests (will be overridden by test configuration)
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json
      client:
        registration:
          backend-api:
            client-id: test-mcp-server
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: backend.read,backend.write
        provider:
          backend-api:
            token-uri: http://localhost:8080/oauth2/token

# Backend API Configuration
backend:
  api:
    base-url: http://localhost:8080
    client-registration-id: backend-api

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    me.pacphi.ai.resos: DEBUG

# Disable actuator security for /health in tests
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
